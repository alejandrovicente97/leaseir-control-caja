name: Control de caja Leaseir

# Laborables, cada dos horas de 07:30 a 19:30 en Madrid (05:30-17:30 UTC en
# verano). El boton de "forzar actualizacion" no puede lanzar el workflow por
# si solo -haria falta un token de GitHub dentro de una pagina publica, y eso
# es dejar la llave puesta-, asi que la alternativa honesta es que casi nunca
# haga falta forzar: con siete pasadas al dia el panel nunca tiene mas de dos
# horas. Cuesta unos 50 minutos de Actions al dia, dentro del plan gratuito.
on:
  schedule:
    - cron: "30 5,7,9,11,13,15,17 * * 1-5"
  workflow_dispatch:
    inputs:
      mes:
        description: "Mes en curso a forzar (YYYYMM). Vacio = mes actual"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: caja
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Sondeo primero y con continue-on-error: asi el log SIEMPRE muestra la
      # tabla cabecera x endpoint con lo que responde Holded, aunque la
      # extraccion falle despues. Un run basta para diagnosticar.
      - name: Sondear la API de Holded
        continue-on-error: true
        env:
          HOLDED_API_KEY: ${{ secrets.HOLDED_API_KEY }}
        run: python holded_extract.py --probar

      - name: Extraer Holded
        env:
          HOLDED_API_KEY: ${{ secrets.HOLDED_API_KEY }}
        run: |
          if [ -z "$HOLDED_API_KEY" ]; then
            echo "::error::Falta el secret HOLDED_API_KEY"; exit 1
          fi
          python holded_extract.py --anos 4 --destino datos/ \
                                   --diagnostico diagnostico/holded.json

      # El Sheet de Eli esta compartido como "cualquiera con el enlace puede ver",
      # asi que se baja con una URL normal. No hace falta cuenta de servicio ni
      # secret de Google. Si algun dia se vuelve a restringir, el script tira
      # automaticamente de GOOGLE_SERVICE_ACCOUNT_JSON.
      - name: Descargar el calendario de cobros de Eli
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -c "from google_sheets import descargar_sheet; descargar_sheet(destino='datos/calendario_eli.xlsx')"

      - name: Calcular el forecast y generar el dashboard
        run: |
          python run.py \
            --fuente holded \
            --holded datos/holded.json \
            --calendario datos/calendario_eli.xlsx \
            --salida publicado/index.html \
            ${{ github.event.inputs.mes && format('--mes {0}', github.event.inputs.mes) || '' }}

      - name: Guardar el dashboard como artefacto privado
        uses: actions/upload-artifact@v4
        with:
          name: caja-leaseir-${{ github.run_number }}
          path: publicado/index.html
          retention-days: 90

      - name: Commitear el dashboard y el historico
        run: |
          git config user.name  "Motor de caja Leaseir"
          git config user.email "actions@leaseir.com"
          # El resultado del run se guarda FUERA del repo antes de tocar git.
          # Si el push choca con otro run (paso con el 44 programado contra el
          # 45 manual), NO se rebasa: dos dashboards generados del mismo dia
          # siempre chocan y el rebase muere -"el rebase no ha podido
          # resolverse solo"-. Lo correcto es resetear a lo ultimo publicado y
          # reaplicar NUESTRO resultado encima: el dashboard mas reciente
          # manda, que es exactamente lo que significa un dashboard.
          cp publicado/index.html "$RUNNER_TEMP/index.html"
          cp diagnostico/holded.json "$RUNNER_TEMP/holded.json" 2>/dev/null || true
          publicar() {
            mkdir -p historico publicado diagnostico
            cp "$RUNNER_TEMP/index.html" publicado/index.html
            cp "$RUNNER_TEMP/index.html" "historico/caja_$(date +%Y%m%d).html"
            # GitHub Pages sirve desde la raiz de main
            cp "$RUNNER_TEMP/index.html" index.html
            git add -f publicado/index.html historico/ index.html
            # esquema, rutas y conteos de la API: sin datos de negocio, sirve
            # para diagnosticar la extraccion sin depender del log de Actions
            if [ -f "$RUNNER_TEMP/holded.json" ]; then
              cp "$RUNNER_TEMP/holded.json" diagnostico/holded.json
              git add -f diagnostico/holded.json
            fi
            git diff --cached --quiet || git commit -m "Caja al $(date +%d/%m/%Y)"
          }
          publicar
          for intento in 1 2 3 4 5; do
            if git push; then
              echo "publicado en el intento $intento"; exit 0
            fi
            echo "::warning::push rechazado (intento $intento), reaplicando encima de lo ultimo"
            git fetch origin main
            git reset --hard origin/main
            publicar
            sleep $((intento * 3))
          done
          echo "::error::no se ha podido publicar tras 5 intentos"; exit 1

      # GitHub Pages queda descartado a proposito: en los planes Free, Pro y Team
      # el sitio es PUBLICO aunque el repositorio sea privado. Se despliega en
      # Cloudflare Pages, que si permite poner una puerta de login delante
      # (Cloudflare Access) sin coste.
      - name: Publicar en Cloudflare Pages
        if: ${{ env.CF_TOKEN != '' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy publicado --project-name=caja-leaseir --branch=main

      - name: Aviso si Cloudflare no esta configurado
        if: ${{ env.CF_TOKEN == '' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "::warning::Sin CLOUDFLARE_API_TOKEN: el dashboard queda solo como artefacto y en publicado/. Ver docs/CLOUDFLARE.md"
