# con vencimiento en ese mes, se proyecta el importe base.
# Si SI la tiene, se usa la factura real (nunca se duplica).
recurrentes:
  metodo_base: mediana_meses_activos   # mediana | media | media_movil_3 | fijo
  ventana_meses: 12
  proveedores:
    - { patron: "NOBIS CAPITAL",   etiqueta: "Nobis Capital",       grupo: "Alquileres" }
    - { patron: "MIRALOMA",        etiqueta: "Miraloma Holdings",   grupo: "Alquileres" }
    - { patron: "Maria Martire",   etiqueta: "Maria Martire",       grupo: "Servicios" }
    - { patron: "DHL",             etiqueta: "DHL (todas)",         grupo: "Transporte" }
    - { patron: "FEDEX",           etiqueta: "FedEx",               grupo: "Transporte" }
    - { patron: "Transcano",       etiqueta: "Transcano (DHL)",     grupo: "Transporte" }
    - { patron: "GIJON DIRECTO",   etiqueta: "MRW Gijon Directo",   grupo: "Transporte" }
    - { patron: "SEUR",            etiqueta: "SEUR",                grupo: "Transporte" }
    - { patron: "Panarcos",        etiqueta: "Panarcos",            grupo: "Transporte" }
    - { patron: "ENDESA",          etiqueta: "Endesa",              grupo: "Suministros" }
    - { patron: "VODAFONE",        etiqueta: "Vodafone",            grupo: "Suministros" }
    - { patron: "TELEFONICA",      etiqueta: "Telefonica",          grupo: "Suministros" }
    - { patron: "Google Cloud",    etiqueta: "Google Cloud",        grupo: "Software" }
    - { patron: "MongoDB",         etiqueta: "MongoDB",             grupo: "Software" }
    - { patron: "ATLASSIAN",       etiqueta: "Atlassian",           grupo: "Software" }
    - { patron: "AYVENS",          etiqueta: "Ayvens",              grupo: "Renting vehiculos" }
    - { patron: "ARVAL",           etiqueta: "Arval",               grupo: "Renting vehiculos" }
    - { patron: "ATHLON",          etiqueta: "Athlon",              grupo: "Renting vehiculos" }
    - { patron: "LEASYS",          etiqueta: "Leasys",              grupo: "Renting vehiculos" }
    - { patron: "URGISA",          etiqueta: "Urgisa",              grupo: "Alquileres" }
    - { patron: "CINK WORKSPACE",  etiqueta: "Cink Workspace",      grupo: "Alquileres" }
    - { patron: "BLUE SELF STORAGE", etiqueta: "Blue Self Storage", grupo: "Alquileres" }

# ---------------------------------------------------------------------------
# 3. COBROS
# ---------------------------------------------------------------------------
cobros:
  # Mes a partir del cual el calendario de Eli tiene cuotas cargadas.
  # 'auto' lo deduce del propio calendario (hoy: 202501). Las facturas
  # anteriores quedan fuera del forecast: o estan cobradas o se cedieron.
  desde_mes: auto

  # QUE SE DA POR COBRABLE Y QUE NO.
  # Hay 1.079.317 euros en retraso. Dar por hecho que entran todos este mes
  # proyecta una caja que no va a existir. El corte es el retraso, que es el
  # unico dato objetivo disponible: lo vencido hace mas de estos dias no se
  # cuenta en el proyectado, y sale listado con nombre e importe en la pestana
  # de Cobros para que lo puedas mirar.
  # No es una probabilidad de impago. Es una linea, y la pones tu. Si sabes que
  # un cliente de los que caen fuera si va a pagar, se mete con 'previsiones'.
  dias_dudoso: 90

  # Rentings: la cuota existe en el calendario de Eli aunque no haya factura
  # en Holded. Se proyecta como "Ajustes positivos (Rentings)".
  proyectar_rentings_sin_factura: true

  # Rentings cedidos al banco (sale & leaseback): la factura entra integra en
  # caja unos meses despues de emitirse, no cuota a cuota.
  rentings_financiados:
    activo: true
    desfase_meses: 2
    cuentas_renting:
      - "Renting"

  # Ventas comprometidas todavia sin facturar (equivale a "Elha (Sin facturar)")
  sin_facturar:
    - { concepto: "Elha", unidades: 6, precio: 24000, iva: 0.21 }

  # Ajustes manuales sobre el forecast de cobros del mes en curso
  ajustes_negativos:
    - { concepto: "Riesgo cobro cliente A", importe: -54000 }
    - { concepto: "Riesgo cobro cliente B", importe: -22000 }
    - { concepto: "Riesgo cobro cliente C", importe:  -8000 }
    - { concepto: "Riesgo cobro cliente D", importe:  -8000 }
  ajustes_positivos: []

  # Clientes que se excluyen del forecast (intercompania, concursos, incobrables).
  # Se siguen calculando y se muestran aparte en el dashboard: fuera del
  # forecast, pero nunca invisibles.
  excluir_clientes:
    - "Leaseir Medical Light, S.L."      # IC, sociedad extinta, no se cobra

  # En la hoja de Eli, las facturas que empiezan por FM vienen de la fusion con
  # LML: son ventas financiadas desde LML cuya factura no se pudo migrar al
  # Holded de LT. No estan en Holded, pero NO estan sin facturar: estan
  # facturadas en otra sociedad y se cobran igual. Entran en el forecast con su
  # propio nombre, no mezcladas con los rentings pendientes de emitir.
  prefijos_fusion: ["FM"]

# ---------------------------------------------------------------------------
# 3.bis PAGOS QUE NO SON CAJA
# ---------------------------------------------------------------------------
# La misma sociedad aparece en Holded como cliente Y como proveedor. Excluirla
# solo del lado de cobros dejaba 4,45 millones de saldo intercompania en el
# forecast de pagos: el 96% de todo el vencido a proveedores, y un julio de
# -4,27 millones que no tenia nada que ver con la caja real.
# Lo excluido no se esconde: sale su importe en "calidad del dato".
#
# Solo va aqui la intercompania de verdad. Cuentas como "LEASEIR - FEDEX" o
# "LEASEIR - ALTAIR" llevan Leaseir en el nombre pero son el transportista o
# el proveedor real facturando a Leaseir: eso SI es caja y se queda dentro.
pagos:
  excluir_proveedores:
    - "Leaseir Medical Light, S.L."      # IC, no sale dinero de la caja

# ---------------------------------------------------------------------------
# 3.ter TESORERIA: LIMITES DE LAS POLIZAS
# ---------------------------------------------------------------------------
# Holded NO publica el limite de credito: en treasury/accounts no existe ese
# campo. El saldo que si da es lo DISPUESTO (en negativo). Sin limite escrito
# aqui, el disponible de la poliza no se puede calcular, y el dashboard dice
# "limite sin configurar" en vez de inventarse un cero que se leeria como
# "no hay financiacion disponible".
#
# El nombre se compara por fragmento, sin acentos ni mayusculas.
tesoreria:
  # Limites tomados de tu "Monthly FCF - Bottom Up - v2", hoja Polizas y filas
  # 57-59 de FCF (2026). El 6575 es el que aparece en Holded. El 9418 se deja
  # preparado por si tambien esta dado de alta ahi con otro nombre.
  # CONFIRMA los limites: la hoja Polizas es de noviembre de 2024 y las
  # operaciones vencian en 2025, asi que estaran renovadas.
  polizas:
    - { cuenta: "6575", limite: 200000 }    # ES1100496735182216276575, LT
    - { cuenta: "9418", limite: 400000 }    # ES9200496735162416279418, LT
    # La de 600.000 (ES2800496735152516277628) es de LML, no de LT: fuera.
  # Se avisa en el panel de que el limite viene de una hoja, no de Holded:
  # Holded no publica limites de credito.
  aviso_limites: "Límites tomados de tu bottom-up (hoja Pólizas, nov-2024). Confírmalos: las operaciones vencían en 2025."
  # Las cuentas y tarjetas a cero no se listan en el dashboard: son ruido.
  # Ponlo en false si prefieres verlas todas.
  ocultar_saldo_cero: true

  # Si el saldo que hay DENTRO de una cuenta de credito cuenta como caja.
  # No: una linea de credito es financiacion disponible, no tesoreria propia.
  # Con esto en true la posicion de julio daba 1.297.931 cuando la caja de
  # verdad son 326.155 y el resto esta en la poliza 9418.
  polizas_en_caja: false

  # Cuentas cuyo saldo Holded declara a CERO teniendo movimiento contable
  # detras: normalmente porque el banco no esta sincronizado. El panel las
  # reconstruye (saldo del 1 de enero + movimiento del ano + lo pendiente de
  # conciliar), pero si tu sabes el saldo, tu numero manda: escribelo aqui.
  #
  # Descomenta y confirma. Es la segunda cuenta de Caixa, la que hacia que la
  # posicion saliera 358.864 en vez de 382.670. La reconstruccion da 25.647;
  # tu dijiste 24.705. Con el saldo escrito aqui se acaba la discusion, pero
  # OJO: un saldo a mano no se actualiza solo, asi que la fecha de "confirmado"
  # sale en el panel para que se vea cuando envejece.
  saldos_manuales: []
  # saldos_manuales:
  #   - cuenta: "CAIXABANK (8744)"
  #     saldo: 24705
  #     confirmado: "2026-07-31"

  # Que parte de las cuentas que Holded si sincroniza tiene que cuadrar
  # (contabilidad + pendiente = banco) para dar por bueno el metodo de
  # reconstruccion. No se exige el pleno a proposito: lo pendiente de conciliar
  # cambia mientras alguien concilia, y entre dos ejecuciones separadas veinte
  # minutos el Sabadell paso de 20.009 de diferencia a cero. Con el pleno, la
  # posicion se corregiria o no segun por donde fuese el contable esa manana.
  minimo_cuadre: 0.6

# ---------------------------------------------------------------------------
# 3.quater LO YA PAGADO DEL MES EN CURSO
# ---------------------------------------------------------------------------
# La nomina de julio sale del banco el dia 25. El saldo de hoy ya la lleva
# descontada, asi que volver a restar los 266.070 enteros en el forecast del
# mes la cuenta dos veces. Igual con las cuotas de S&L, que no vencen todas el
# mismo dia: en julio no se han pagado todas.
#
# Aqui se dice como se reconoce cada partida fija en el extracto bancario. Se
# busca el fragmento dentro del concepto, sin acentos ni mayusculas, y cada
# apunte cuenta una sola vez (gana el primer bloque que lo reclama).
ejecutado:
  patrones:
    salarios:
      - "nomina"
      - "nominas"
      - "seguridad social"
      - "tgss"
      - "rgss"
    cuotas_sl:
      - "amortizacion"
      - "cargo por amorti"
      - "renting"
      - "leasing"
      - "cuota prestamo"
      - "vencimiento prestamo"
    recurrentes: []
    otros_fijos: []

# ---------------------------------------------------------------------------
# 3.quinquies PREVISIONES: LO QUE DE VERDAD SE VA A COBRAR Y A PAGAR
# ---------------------------------------------------------------------------
# El motor proyecta que una factura vencida es exigible. La realidad es que hay
# clientes que no van a pagar este mes, o no van a pagar entero, y eso no esta
# en Holded ni puede estarlo: es criterio de quien lleva la caja.
#
# Cada linea dice: para este cliente o proveedor, en este mes, el importe de
# verdad es este. importe: 0 significa "no se cobra".
#
#   tipo    cobro | pago
#   clave   nombre del cliente/proveedor tal cual sale en el panel, o el
#           numero de factura
#   mes     YYYYMM. Si no esta entre los meses del forecast, se ignora
#   importe el importe realista, en positivo
#   nota    por que. Sale en el panel al lado de la cifra
#
# Nada se aplica en silencio: el panel enseña cada correccion con lo que decia
# el motor, lo que dice la prevision y la diferencia. Y si una clave no casa
# con ningun cliente, lo dice en rojo en vez de callarse.
#
# Ejemplo (quita el comentario y edita):
previsiones: []
#   - { tipo: cobro, clave: "CORPODERM (DistRec-12)", mes: 202607, importe: 150000,
#       nota: "acuerdo de pago: 150k este mes y el resto en septiembre" }
#   - { tipo: cobro, clave: "AMB AESTHETICS LTD", mes: 202607, importe: 0,
#       nota: "no responde, no contamos con ello" }
#   - { tipo: pago,  clave: "Monocrom S.L.", mes: 202607, importe: 80000,
#       nota: "negociado aplazamiento del resto" }

# ---------------------------------------------------------------------------
# 4. CLASIFICACION DE CERTIDUMBRE  (el "Mapping Nacho" 1-6)
# ---------------------------------------------------------------------------
certidumbre:
  cobros:
    1: "Cobros seguros"      # factura emitida, vencimiento en el mes, sin retraso
    2: "Cobros posibles"     # sin factura o vencimiento incierto
    3: "Cobros retrasados"   # vencido y no cobrado
  pagos:
    4: "Pagos seguros"       # nominas, cuotas banco, vencimiento en el mes
    5: "Pagos posibles"      # proyectados / variables
    6: "Pagos retrasados"    # vencidos y no pagados
  # Dias desde vencimiento a partir de los cuales se considera "retrasado"
  dias_retraso: 0

# ---------------------------------------------------------------------------
# 5. CUADRE DE CAJA
# ---------------------------------------------------------------------------
cuadre:
  # Cuentas de clientes del plan contable para el check contra contabilidad.
  # 430 Clientes, 431 Efectos comerciales a cobrar, 432 Clientes, operaciones
  # de factoring. Si el saldo de estas cuentas no es exigible + aplazado, o el
  # calendario de Eli esta mal cargado o hay facturas fuera de alcance.
  cuentas_clientes: ["430", "431", "432", "435", "436"]

  # Lo que hay que quitar de la variacion de caja para que sea UNLEVERED:
  # principal de prestamos y polizas, intereses y gastos financieros, y
  # movimientos con socios. Es la misma frontera que usa el bottom-up.
  # OJO con el detalle: "55" a secas incluia la 555, Partidas pendientes de
  # aplicacion, que NO es financiacion sino apuntes sin aplicar todavia. Con
  # ella dentro el unlevered de julio daba -133.569 y sin ella -2.449. Se
  # enumeran las cuentas de socios una a una.
  cuentas_financiacion: ["17", "52", "527", "66", "551", "552", "553"]

  # Pagos de deuda: lo que hay que devolver al levered para llegar al
  # unlevered. Principal de prestamos y polizas (17*, 52*), intereses y gastos
  # financieros (66*, 527).
  cuentas_deuda: ["17", "52", "527", "66"]

  # Cuentas puente: el dinero se ha movido pero todavia no se ha llevado a su
  # cuenta definitiva. Ni financiacion ni explotacion. En julio habia 145.000
  # aqui: dejarlos dentro mueve el unlevered esa cifra sin que nadie sepa de
  # que. Se sacan y el panel dice cuanto queda por clasificar.
  cuentas_suspenso: ["555", "554"]

  # Numero de cuentas distintas a partir del cual un asiento del 1 de enero se
  # considera el de apertura del ejercicio y no un movimiento. Con 3,5 millones
  # en juego -eso valia la apertura de 2026- conviene que sea explicito.
  lineas_apertura: 20

  # Dentro de las cuentas puente, las que son traspasos entre cuentas propias.
  # No son caja ni hay nada que clasificar: se anulan solas. Se separan de las
  # que si estan pendientes de aplicar de verdad para no mandar a nadie a
  # revisar movimientos que ya estan explicados.
  patrones_traspaso: ["traspaso", "transferencia entre cuentas", "entre bancos"]

  # Entidades cuyas cuotas son financiacion aunque esten dadas de alta como
  # proveedor. Las de cuotas_sl.operaciones entran solas; aqui van las demas.
  # En julio son 80.248 euros a Banco Santander en la cuenta 40000111: para el
  # bottom-up eso es amortizacion de un sale & leaseback, no una compra.
  # Probado y descartado: con las cuotas de S&L dentro de financiacion, el
  # contraste contra el bottom-up empeora en los cuatro meses comparables
  # (abril de 4k a 115k de diferencia, marzo de 52k a 463k). En el modelo de
  # Alejandro la cuota es explotacion; en la tabla de deuda esta el saldo vivo,
  # no la cuota. Se deja el interruptor por si el criterio cambia.
  cuotas_sl_son_financiacion: false

  entidades_financieras:
    - "BANCO SANTANDER S.A."
    - "BBVA, S.A."
    - "BANCO DE SABADELL S.A."
    - "CSI RENTING DE TECNOLOGIA, SAU"
    - "CAIXABANK, S.A."
  tolerancia_eur: 1000        # diferencia aceptable en el check mensual
  incluir_polizas: false      # el check se hace sobre saldo sin polizas

# ---------------------------------------------------------------------------
# 6. FORECAST
# ---------------------------------------------------------------------------
forecast:
  meses_adelante: 2           # M0 + M+1 + M+2
  # Los pagos a proveedor se acumulan por fecha de vencimiento: el forecast del
  # mes X incluye TODO lo pendiente con vencimiento <= fin de X (arrastra vencidos)
  arrastrar_vencidos: true

# ---------------------------------------------------------------------------
# 7. CONTRASTE CON EL EXCEL (para validar el motor en la primera vuelta)
# ---------------------------------------------------------------------------
# Cifras del "20260717 - Forecast CashFlow.xlsx", columna H (Total) del mes.
# Sirven para ver el puente entre lo que calcula el motor y lo que tenias a mano.
contraste_excel:
  activo: true
  fichero: "20260717 - Forecast CashFlow.xlsx"
  mes: 202607
  cash_in: 1595725
  cash_out: -1500057
  fcf: 95668
  cobro_clientes: 1371508
  rentings_ajuste: 166976
  pago_proveedores: -1007873
  proveedores_variable: -86536
  salarios: -266070
  cuotas_sl: -133928
  # Partidas que en tu Excel metes a mano y que aqui deben ir a
  # cobros.ajustes_positivos para que el motor las recoja:
  adicionales_manuales:
    - { concepto: "Columna 'Adicional' del mes",        importe: 137758 }
    - { concepto: "Ajustes manuales dentro de F6",      importe:  54468 }
    - { concepto: "Ajuste manual dentro de 'Otros'",    importe:  36000 }

# ---------------------------------------------------------------------------
# 8. PUBLICACION
# ---------------------------------------------------------------------------
publicacion:
  # El boton "Forzar actualizacion" del dashboard abre esta pagina, desde donde
  # se relanza el workflow a mano sin esperar a las 07:30.
  url_workflow: "https://github.com/alejandrovicente97/leaseir-control-caja/actions/workflows/caja.yml"
  zona_horaria: "Europe/Madrid"
