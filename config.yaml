# ---------------------------------------------------------------------------
# 3. COBROS
# ---------------------------------------------------------------------------
cobros:
  # Mes a partir del cual el calendario de Eli tiene cuotas cargadas.
  # 'auto' lo deduce del propio calendario (hoy: 202501). Las facturas
  # anteriores quedan fuera del forecast: o estan cobradas o se cedieron.
  desde_mes: auto

  # QUE SE DA POR COBRABLE Y QUE NO.
  # Hay 1.079.317 euros en retraso. Dar por hecho que entran todos este mes
  # proyecta una caja que no va a existir. El corte es el retraso, que es el
  # unico dato objetivo disponible: lo vencido hace mas de estos dias no se
  # cuenta en el proyectado, y sale listado con nombre e importe en la pestana
  # de Cobros para que lo puedas mirar.
  # No es una probabilidad de impago. Es una linea, y la pones tu. Si sabes que
  # un cliente de los que caen fuera si va a pagar, se mete con 'previsiones'.
  dias_dudoso: 90

  # Rentings: la cuota existe en el calendario de Eli aunque no haya factura
  # en Holded. Se proyecta como "Ajustes positivos (Rentings)".
  proyectar_rentings_sin_factura: true

  # Rentings cedidos al banco (sale & leaseback): la factura entra integra en
  # caja unos meses despues de emitirse, no cuota a cuota.
  rentings_financiados:
    activo: true
    desfase_meses: 2
    cuentas_renting:
      - "Renting"

  # Ventas comprometidas todavia sin facturar (equivale a "Elha (Sin facturar)")
  sin_facturar:
    - { concepto: "Elha", unidades: 6, precio: 24000, iva: 0.21 }

  # Ajustes manuales sobre el forecast de cobros del mes en curso
  ajustes_negativos:
    - { concepto: "Riesgo cobro cliente A", importe: -54000 }
    - { concepto: "Riesgo cobro cliente B", importe: -22000 }
    - { concepto: "Riesgo cobro cliente C", importe:  -8000 }
    - { concepto: "Riesgo cobro cliente D", importe:  -8000 }
  ajustes_positivos: []

  # Clientes que se excluyen del forecast (intercompania, concursos, incobrables).
  # Se siguen calculando y se muestran aparte en el dashboard: fuera del
  # forecast, pero nunca invisibles.
  excluir_clientes:
    - "Leaseir Medical Light, S.L."      # IC, sociedad extinta, no se cobra

  # En la hoja de Eli, las facturas que empiezan por FM vienen de la fusion con
  # LML: son ventas financiadas desde LML cuya factura no se pudo migrar al
  # Holded de LT. No estan en Holded, pero NO estan sin facturar: estan
  # facturadas en otra sociedad y se cobran igual. Entran en el forecast con su
  # propio nombre, no mezcladas con los rentings pendientes de emitir.
  prefijos_fusion: ["FM"]

# ---------------------------------------------------------------------------
# 3.bis PAGOS QUE NO SON CAJA
# ---------------------------------------------------------------------------
# La misma sociedad aparece en Holded como cliente Y como proveedor. Excluirla
# solo del lado de cobros dejaba 4,45 millones de saldo intercompania en el
# forecast de pagos: el 96% de todo el vencido a proveedores, y un julio de
# -4,27 millones que no tenia nada que ver con la caja real.
# Lo excluido no se esconde: sale su importe en "calidad del dato".
#
# Solo va aqui la intercompania de verdad. Cuentas como "LEASEIR - FEDEX" o
# "LEASEIR - ALTAIR" llevan Leaseir en el nombre pero son el transportista o
# el proveedor real facturando a Leaseir: eso SI es caja y se queda dentro.
  # LINEA DE NEGOCIO POR CLIENTE (el 'Mapping Simple' de su Control de
  # cobros). Snapshot cruzando 2.661 facturas de su hoja Holded con su
  # hoja Mapping (cuenta -> linea), el 31-jul-2026. Se usa cuando el
  # Sheet de Eli no trae la hoja Mapping; si algun dia la trae, manda
  # la del Sheet. Claves normalizadas (minusculas, sin acentos).
  mapping_comercial:
